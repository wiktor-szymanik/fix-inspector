[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fix-inspector"
dynamic = ["version"]
description = "Desktop FIX-aware interception and security-testing proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6==6.11.2",
]

[project.scripts]
fix-inspector = "fixinspector.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fixinspector.__version__"}
